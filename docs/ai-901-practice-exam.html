<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-901 – Praktický test (40 otázok)</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171c25;
    --panel-2: #1e2531;
    --line: #2a3344;
    --txt: #e6eaf2;
    --muted: #94a1b8;
    --accent: #4c8dff;
    --ok: #2ecc71;
    --ok-bg: rgba(46, 204, 113, .12);
    --bad: #ff5f6d;
    --bad-bg: rgba(255, 95, 109, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font: 15px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15, 18, 24, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 12px;
  }
  button.ctl, .chip {
    background: var(--panel-2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button.ctl:hover, .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stats { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .stats b { color: var(--txt); }
  .progress {
    height: 4px; background: var(--line); border-radius: 4px;
    margin-top: 10px; overflow: hidden;
  }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  main { max-width: 860px; margin: 0 auto; padding: 22px 20px 80px; }
  h2.section {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 32px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  h2.section:first-child { margin-top: 0; }

  .q {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; }
  .num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 12px; color: var(--muted);
  }
  .q.done .num { border-color: transparent; color: #fff; }
  .q.right .num { background: var(--ok); }
  .q.wrong .num { background: var(--bad); }
  .q-text { font-weight: 600; }
  .hint { display: block; font-weight: 400; font-size: 12px; color: var(--accent); margin-top: 3px; }

  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; margin-bottom: 7px; cursor: pointer;
    background: var(--panel-2); transition: border-color .15s, background .15s;
  }
  .opt:hover:not(.locked) { border-color: var(--accent); }
  .opt.locked { cursor: default; }
  .letter { flex: none; font-weight: 700; color: var(--muted); width: 16px; }
  .opt.sel { border-color: var(--accent); }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.ok .letter { color: var(--ok); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.bad .letter { color: var(--bad); }
  .mark { margin-left: auto; font-weight: 700; }
  .opt.ok .mark { color: var(--ok); }
  .opt.bad .mark { color: var(--bad); }

  .explain {
    display: none; margin-top: 12px; padding: 11px 14px;
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    background: rgba(76, 141, 255, .08); font-size: 14px;
  }
  .q.done .explain { display: block; }
  .verdict { font-weight: 700; margin-right: 6px; }
  .q.right .verdict { color: var(--ok); }
  .q.wrong .verdict { color: var(--bad); }

  code { background: #0b0e14; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .hidden { display: none !important; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); }
</style>
</head>

const QUESTIONS = [
/* ---------- Section 1: Responsible AI ---------- */

{ s:2, q:"You just need the raw printed and handwritten text extracted from scanned pages, with no schema and no field mapping. Which capability fits?",

{ s:2, q:"An app should accept a photo and answer free form questions about it, for example “what is unusual here?”. What is the best fit?",

const LETTERS = "ABCDE";
const quizEl = document.getElementById("quiz");
let order = QUESTIONS.map((_, i) => i);
let filter = "all";
let shuffled = false;
let state = {};   // index -> {picked:[], right:bool}

function render() {
  quizEl.innerHTML = "";
  let lastSec = null;
  const visible = order.filter(i => filter === "all" || QUESTIONS[i].s === +filter);

  visible.forEach((idx, pos) => {
    const q = QUESTIONS[idx];
    if (filter === "all" && !shuffled && q.s !== lastSec) {
      lastSec = q.s;
      const h = document.createElement("h2");
      h.className = "section";
      h.textContent = SECTIONS[q.s];
      quizEl.appendChild(h);
    }
    quizEl.appendChild(buildCard(q, idx, pos + 1));
  });
  updateStats();
}

function buildCard(q, idx, displayNo) {
  const multi = q.a.length > 1;
  const card = document.createElement("article");
  card.className = "q";
  card.dataset.idx = idx;

  const head = document.createElement("div");
  head.className = "q-head";
  head.innerHTML = `<div class="num">${displayNo}</div>
    <div class="q-text">${q.q}${multi ? '<span class="hint">Vyber 2 odpovede – vyhodnotí sa po druhom kliknutí.</span>' : ''}</div>`;
  card.appendChild(head);

  q.o.forEach((text, oi) => {
    const opt = document.createElement("div");
    opt.className = "opt";
    opt.dataset.oi = oi;
    opt.innerHTML = `<span class="letter">${LETTERS[oi]}</span><span>${text}</span><span class="mark"></span>`;
    opt.addEventListener("click", () => pick(card, q, idx, oi));
    card.appendChild(opt);
  });

  const exp = document.createElement("div");
  exp.className = "explain";
  const correct = q.a.map(i => LETTERS[i]).join(" + ");
  exp.innerHTML = `<div><span class="verdict"></span>Správna odpoveď: <b>${correct}</b></div><div style="margin-top:6px">${q.e}</div>`;
  card.appendChild(exp);

  const st = state[idx];
  if (st) applyResult(card, q, st);
  return card;
}

function pick(card, q, idx, oi) {
  if (state[idx]) return;                       // už vyhodnotené
  const multi = q.a.length > 1;
  const optEl = card.querySelector(`.opt[data-oi="${oi}"]`);

  if (!multi) {
    finish(card, q, idx, [oi]);
    return;
  }

  optEl.classList.toggle("sel");
  const picked = [...card.querySelectorAll(".opt.sel")].map(e => +e.dataset.oi);
  if (picked.length === q.a.length) finish(card, q, idx, picked);
}

function finish(card, q, idx, picked) {
  const right = picked.length === q.a.length && picked.every(p => q.a.includes(p));
  state[idx] = { picked, right };
  applyResult(card, q, state[idx]);
  updateStats();
}

function applyResult(card, q, st) {
  card.classList.add("done", st.right ? "right" : "wrong");
  card.querySelectorAll(".opt").forEach(el => {
    const oi = +el.dataset.oi;
    el.classList.remove("sel");
    el.classList.add("locked");
    const mark = el.querySelector(".mark");
    if (q.a.includes(oi)) { el.classList.add("ok"); mark.textContent = "✓"; }
    else if (st.picked.includes(oi)) { el.classList.add("bad"); mark.textContent = "✗"; }
  });
  card.querySelector(".verdict").textContent = st.right ? "Správne." : "Nesprávne.";
}

function updateStats() {
  const done = Object.keys(state).length;
  const ok = Object.values(state).filter(s => s.right).length;
  document.getElementById("sOk").textContent = ok;
  document.getElementById("sDone").textContent = done;
  document.getElementById("sLeft").textContent = QUESTIONS.length - done;
  document.getElementById("bar").style.width = (done / QUESTIONS.length * 100) + "%";
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    filter = chip.dataset.sec;
    render();
    window.scrollTo({ top: 0 });
  });
});

document.getElementById("shuffle").addEventListener("click", () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  shuffled = true;
  filter = "all";
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.sec === "all"));
  render();
  window.scrollTo({ top: 0 });
});

document.getElementById("reset").addEventListener("click", () => {
  state = {};
  order = QUESTIONS.map((_, i) => i);
  shuffled = false;
  render();
  window.scrollTo({ top: 0 });
});

render();
</script>
</body>
</html>
